<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Particle Sandbox Alpha 1.7.1 Patch</title>
    <style>
        body {
            margin: 0;
            display: flex;
            font-family: sans-serif;
            background: #222;
            color: #eee;
            height: 100vh;
        }

        #sidebar {
            width: 200px;
            padding: 10px;
            background: #333;
            overflow-y: auto;
            flex-shrink: 0;
        }

        button, label {
            width: 100%;
            margin-bottom: 5px;
            padding: 5px;
            font-size: 14px;
            display: block;
        }

        input[type=range] {
            width: 100%;
            margin-bottom: 10px;
        }

        canvas {
            border: 1px solid #555;
            cursor: crosshair;
            margin: 10px;
            flex-shrink: 0;
            display: block;
        }

        #formButton {
            margin-top: 10px;
            background: #666;
            color: #fff;
            padding: 5px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <strong>Particles</strong>
        <button style="background:#d4b96a;" onclick="setParticle('sand')">Sand</button>
        <button style="background:#4da6ff;" onclick="setParticle('water')">Water</button>
        <button style="background:#8B4513;" onclick="setParticle('dirt')">Dirt</button>
        <button style="background:#654321;" onclick="setParticle('mud')">Mud</button>
        <button style="background:#A9A9A9;" onclick="setParticle('stone')">Stone</button>
        <button style="background:#FFD700;" onclick="setParticle('gold')">Gold</button>
        <button style="background:#B0C4DE;" onclick="setParticle('iron')">Iron</button>
        <button style="background:#C0C0C0;" onclick="setParticle('silver')">Silver</button>
        <button style="background:#B87333;" onclick="setParticle('copper')">Copper</button>
        <button style="background:#E5E4E2;" onclick="setParticle('platinum')">Platinum</button>
        <button style="background:#222222;" onclick="setParticle('coal')">Coal</button>
        <button style="background:#000000;" onclick="setParticle('oil')">Oil</button>
        <button style="background:red;" onclick="setParticle('tnt')">TNT</button>
        <button style="background:orange;" onclick="setParticle('fire')">Fire</button>
        <button style="background:#FF4500;" onclick="setParticle('lava')">Lava</button>
        <button style="background:white; color:black;" onclick="setParticle('ash')">Ash</button>
        <button style="background:#555;" onclick="setParticle('eraser')">Eraser</button>

        <strong>Brush Size</strong>
        <label for="brushSlider">Size: <span id="brushValue">5</span></label>
        <input type="range" id="brushSlider" min="1" max="50" value="5">
        <button onclick="setBrushPreset(1)">Tiny</button>
        <button onclick="setBrushPreset(5)">Small</button>
        <button onclick="setBrushPreset(15)">Medium</button>
        <button onclick="setBrushPreset(30)">Large</button>
        <button onclick="setBrushPreset(50)">Mega</button>

        <strong>Canvas Size</strong>
        <button onclick="createCanvas(600,400)">Small</button>
        <button onclick="createCanvas(1024,600)">Medium</button>
        <button onclick="createCanvas(1368,768)">Fullscreen</button>
        <div>
            <strong>Advanced Canvas</strong>
            <label>Width: <input type="number" id="customWidth" value="1024"></label>
            <label>Height: <input type="number" id="customHeight" value="600"></label>
            <button onclick="createCustomCanvas()">Apply</button>
        </div>

        <button onclick="clearCanvas()">Clear</button>
    </div>

    <canvas id="canvas" width="1024" height="600"></canvas>
    <div id="formButton" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScdbPn8efZfhfTKMuHCjxtnX8QPBuTTl-djt7bKc-SI_FWn8Q/viewform?usp=dialog')">Suggestions / Feedback</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width, height = canvas.height;
        let grid = [];

        function initGrid(w, h) { grid = Array.from({ length: w }, () => Array(h).fill(null)); }
        initGrid(width, height);

        // Properties
        const properties = {
            sand: { density: 3, flammable: false },
            dirt: { density: 3, flammable: false },
            mud: { density: 3, flammable: false },
            stone: { density: 4, flammable: false },
            water: { density: 1, flammable: false },
            lava: { density: 3.2, flammable: false, hot: true },
            oil: { density: 0.9, flammable: true },
            tnt: { density: 2, flammable: true },
            fire: { density: 0, flammable: false },
            ash: { density: 0.5, flammable: false },
            coal: { density: 2.5, flammable: true },
            iron: { density: 4, flammable: false },
            gold: { density: 3.5, flammable: false },
            silver: { density: 3, flammable: false },
            copper: { density: 3, flammable: false },
            platinum: { density: 5, flammable: false },
        };

        // UI
        let currentParticle = 'sand';
        let brushSize = 5;
        const brushSlider = document.getElementById('brushSlider');
        const brushValue = document.getElementById('brushValue');
        brushSlider.addEventListener('input', () => { brushSize = parseInt(brushSlider.value); brushValue.textContent = brushSize; });
        function setBrushPreset(size) { brushSize = size; brushSlider.value = size; brushValue.textContent = size; }
        function setParticle(type) { currentParticle = type; }
        function clearCanvas() { initGrid(width, height); }
        function createCanvas(w, h) { canvas.width = w; canvas.height = h; width = w; height = h; initGrid(width, height); lastMouse = null; }
        function createCustomCanvas() { createCanvas(parseInt(document.getElementById('customWidth').value), parseInt(document.getElementById('customHeight').value)); }

        // Mouse
        let isMouseDown = false, lastMouse = null;
        canvas.addEventListener('mousedown', e => { isMouseDown = true; handleMouse(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; lastMouse = null; });
        canvas.addEventListener('mouseleave', () => { isMouseDown = false; lastMouse = null; });
        canvas.addEventListener('mousemove', e => { if (isMouseDown) handleMouse(e); });

        function handleMouse(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
            const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
            if (lastMouse) {
                const dx = x - lastMouse.x, dy = y - lastMouse.y, steps = Math.max(Math.abs(dx), Math.abs(dy));
                for (let i = 0; i <= steps; i++) {
                    const ix = Math.round(lastMouse.x + dx * i / steps), iy = Math.round(lastMouse.y + dy * i / steps);
                    placeParticle(ix, iy);
                }
            } else placeParticle(x, y);
            lastMouse = { x, y };
        }

        function placeParticle(x, y) {
            for (let dx = -Math.floor(brushSize / 2); dx <= Math.floor(brushSize / 2); dx++) {
                for (let dy = -Math.floor(brushSize / 2); dy <= Math.floor(brushSize / 2); dy++) {
                    const px = x + dx, py = y + dy;
                    if (px >= 0 && px < width && py >= 0 && py < height) {
                        if (currentParticle === 'eraser') grid[px][py] = null;
                        else grid[px][py] = { type: currentParticle, life: 0, falling: false };
                    }
                }
            }
        }

        // Utilities
        function getRes(type) {
            const map = { 'sand': 1, 'mud': 0.75, 'dirt': 1, 'stone': 5, 'iron': 4, 'gold': 3.5, 'silver': 3, 'copper': 3, 'platinum': 5, 'coal': 0.5, 'tnt': 0, 'lava': 0, 'oil': 0, 'fire': 0, 'ash': 0 };
            return map[type] || 1;
        }

        function explode(x, y, radius = 10) {
            for (let i = Math.max(0, x - radius); i <= Math.min(width - 1, x + radius); i++) {
                for (let j = Math.max(0, y - radius); j <= Math.min(height - 1, y + radius); j++) {
                    const dist = Math.hypot(i - x, j - y);
                    if (dist <= radius) {
                        const cell = grid[i]?.[j];
                        if (!cell) continue;
                        const dmg = radius - dist;
                        if (dmg > getRes(cell.type)) grid[i][j] = { type: 'fire' };
                    }
                }
            }
        }

        // Update
        function update() {
            const active = [];
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (grid[x]?.[y]) active.push([x, y]);
                }
            }
            // Shuffle for randomness
            for (let i = active.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [active[i], active[j]] = [active[j], active[i]];
            }

            for (const [x, y] of active) {
                const cell = grid[x]?.[y];
                if (!cell) continue;
                const p = cell.type;
                const prop = properties[p] || {};
                cell.falling = false;

                // FIRE
                if (p === 'fire') {
                    const dirs = [[0, -1], [-1, 0], [1, 0], [0, 1]];
                    for (const [dx, dy] of dirs) {
                        const nx = x + dx, ny = y + dy;
                        const target = grid[nx]?.[ny];
                        if (!target) continue;
                        if (target.type === 'tnt') explode(nx, ny, 12);
                        if (properties[target.type]?.flammable) grid[nx][ny] = { type: 'fire' };
                        if (target.type === 'oil') grid[nx][ny] = { type: 'fire' };
                        if (target.type === 'coal') grid[nx][ny] = { type: 'fire' };
                    }
                    if (Math.random() < 0.02) grid[x][y] = null;
                    continue;
                }

                // LAVA
                if (p === 'lava') {
                    const below = grid[x]?.[y + 1];
                    // Check for solid collision
                    if (y + 1 < height && (!below || (properties[below.type]?.density || 0) < prop.density)) {
                        grid[x][y + 1] = cell;
                        grid[x][y] = below || null;
                        cell.falling = true;
                        continue;
                    }
                    // Spread sideways
                    const dirs = [-1, 1];
                    for (const dx of dirs) {
                        const nx = x + dx;
                        if (nx >= 0 && nx < width && !grid[nx]?.[y]) {
                            grid[nx][y] = cell; grid[x][y] = null; cell.falling = true; break;
                        }
                    }
                    // Lava ignites coal and oil underneath
                    for (const dx of [-1, 0, 1]) {
                        const nx = x + dx;
                        const ny = y + 1;
                        const target = grid[nx]?.[ny];
                        if (target && (target.type === 'oil' || target.type === 'coal')) grid[nx][ny] = { type: 'fire' };
                    }
                }

                // SOLIDS
                if (['sand', 'dirt', 'mud', 'stone', 'coal'].includes(p)) {
                    const below = grid[x]?.[y + 1];
                    if (y + 1 < height && (!below || (properties[below.type]?.density || 0) < prop.density)) {
                        grid[x][y + 1] = cell; grid[x][y] = below || null; cell.falling = true;
                        continue;
                    } else if (y + 1 < height && x > 0 && !grid[x - 1]?.[y + 1]) {
                        grid[x - 1][y + 1] = cell; grid[x][y] = null; cell.falling = true; continue;
                    } else if (y + 1 < height && x + 1 < width && !grid[x + 1]?.[y + 1]) {
                        grid[x + 1][y + 1] = cell; grid[x][y] = null; cell.falling = true; continue;
                    }
                }

                // LIQUIDS
                if (['water', 'oil'].includes(p)) {
                    const below = grid[x]?.[y + 1];
                    if (y + 1 < height && (!below || (properties[below.type]?.density || 0) < prop.density)) {
                        grid[x][y + 1] = cell; grid[x][y] = below || null; cell.falling = true; continue;
                    }
                    const dir = Math.random() < 0.5 ? -1 : 1;
                    if (x + dir >= 0 && x + dir < width && !grid[x + dir]?.[y]) {
                        grid[x + dir][y] = cell; grid[x][y] = null; cell.falling = true; continue;
                    }
                }

                // TNT
                if (p === 'tnt' && cell.life > 0) { cell.life--; if (cell.life <= 0) explode(x, y, 12); }
            }
        }

        // Draw
        function draw() {
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[x]?.[y];
                    let r = 34, g = 34, b = 34;
                    if (cell) {
                        let tint = 0;
                        if (cell.falling) tint = 20; // falling particles get slightly different color
                        switch (cell.type) {
                            case 'sand': r = 212 + tint; g = 185 + tint; b = 106 + tint; break;
                            case 'water': r = 77; g = 166 + tint; b = 255 + tint; break;
                            case 'dirt': r = 139 + tint; g = 69 + tint; b = 19 + tint; break;
                            case 'mud': r = 100 + tint; g = 55 + tint; b = 20 + tint; break;
                            case 'stone': r = 169 + tint; g = 169 + tint; b = 169 + tint; break;
                            case 'coal': r = 64 + tint; g = 64 + tint; b = 64 + tint; break;
                            case 'oil': r = tint; g = tint; b = tint; break;
                            case 'lava': r = 255; g = 69 + tint; b = 0 + tint; break;
                            case 'fire': r = 255; g = 150 + Math.random() * 50 | 0; b = 0; break;
                            case 'tnt': r = 255; g = 0; b = 0; break;
                            case 'ash': r = 200; g = 200; b = 200; break;
                        }
                    }
                    const idx = (y * width + x) * 4;
                    data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // Loop
        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
